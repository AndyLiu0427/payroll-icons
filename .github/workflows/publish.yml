name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # npm provenance links the published package to the workflow run that
      # built it, which only means anything if the source is public — npm
      # rejects it from a private repository. Enable it automatically once this
      # repo goes public rather than leaving a release to fail on the flag.
      - name: Publish to npm
        run: |
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Private repository — publishing without provenance."
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRIVATE: ${{ github.event.repository.private }}
