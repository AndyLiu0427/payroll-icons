name: Publish

on:
  release:
    types: [published]
  # Preflight only — see the `preflight` job. Publishes nothing.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # Answers "will the release actually work?" without cutting one: checks the
  # token is valid, that it can reach the scope we publish under, and that the
  # tarball contains what it should. Run this before every first release to a
  # new name, and after rotating NPM_TOKEN.
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: Who does NPM_TOKEN belong to?
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Advisory only. There is no read-only call that proves "this token may
      # publish to this scope": `npm access list packages` also fails when the
      # scope is simply empty, and when the token has no organisation read
      # permission — which is the recommended setting for a publish-only token.
      # The token's own configuration page is the authority; this step exists to
      # surface npm's actual error, not to pass judgement.
      - name: Scope diagnostics
        continue-on-error: true
        run: |
          SCOPE=$(node -p "require('./package.json').name.split('/')[0]")
          NAME=$(node -p "require('./package.json').name")
          echo "package: $NAME"
          if [ "${SCOPE#@}" = "$SCOPE" ]; then
            echo
            echo "Unscoped package. A granular token cannot create an unscoped"
            echo "package that does not exist yet — publish the first version"
            echo "from a workstation, then let CI take over."
            exit 0
          fi
          echo "scope:   $SCOPE"
          echo
          echo "--- npm access list packages $SCOPE ---"
          npm access list packages "$SCOPE" || true
          echo
          echo "--- npm org ls ${SCOPE#@} ---"
          npm org ls "${SCOPE#@}" || true
          echo
          echo "An error above does not mean the release will fail: an empty"
          echo "scope and a token without organisation read both look like this."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: What would ship?
        run: npm pack --dry-run

  npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # npm provenance links the published package to the workflow run that
      # built it, which only means anything if the source is public — npm
      # rejects it from a private repository. Enable it automatically once this
      # repo goes public rather than leaving a release to fail on the flag.
      - name: Publish to npm
        run: |
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "Private repository — publishing without provenance."
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_PRIVATE: ${{ github.event.repository.private }}
