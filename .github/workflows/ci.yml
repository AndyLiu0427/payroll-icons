name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Fails the build when a composition breaks a system rule — badging a
      # display-only base, or repeating a glyph the base already contains.
      - name: Validate and generate icons
        run: npm run icons

      - name: Typecheck
        run: npm run typecheck

      # Pins the path data. The build validates that masters are well formed;
      # only the snapshot catches a drawing that changed when it should not have.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build package
        run: npm run build

      # Resolves the built package the way Node and webpack will, not the way a
      # permissive bundler does. Two release blockers got past everything else.
      - name: Smoke test the built package
        run: npm run smoke

      # The curated subset must keep building — it is easy to break by adding a
      # composition that depends on something outside core.
      - name: Build the core subset
        run: npm run build:core
